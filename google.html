<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Mode</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #202124;
      background-color: #fff;
    }
    
    header {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 24px;
      gap: 16px;
      font-size: 14px;
    }
    
    header button.nav-link {
      background: none;
      border: none;
      font-size: 14px;
      color: #3c4043;
      cursor: pointer;
    }
    
    header button.nav-link:hover {
      text-decoration: underline;
    }
    
    .avatar-btn {
      width: 38px;
      height: 38px;
      background-color: #1a73e8;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }
    
    .btn-login {
      display: none;
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 9px 23px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    
    .btn-login:hover {
      background-color: #1557b0;
    }
    
    /* Tarjeta desplegable de perfil */
    .account-card {
      display: none;
      position: absolute;
      top: 65px;
      right: 20px;
      width: 300px;
      background-color: #e9eef6;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .account-card.active {
      display: flex;
    }
    
    .account-big-avatar {
      width: 64px;
      height: 64px;
      background-color: #1a73e8;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 12px 0 8px 0;
    }
    
    .account-name {
      font-size: 17px;
      font-weight: bold;
    }
    
    .account-email {
      font-size: 13px;
      color: #444746;
      margin-bottom: 16px;
    }
    
    .action-btn {
      background-color: #ffffff;
      border: 1px solid #747775;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }
    
    /* Buscador central */
    #vista-busqueda {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      margin-top: -60px;
    }
    
    .logo {
      font-size: 80px;
      font-weight: bold;
      letter-spacing: -2px;
      margin-bottom: 25px;
      user-select: none;
    }
    
    .b-blue {
      color: #4285F4;
    }
    
    .b-red {
      color: #EA4335;
    }
    
    .b-yellow {
      color: #FBBC05;
    }
    
    .b-green {
      color: #34A853;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 584px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 10px 18px;
    }
    
    .search-icon {
      font-size: 18px;
      margin-right: 12px;
      color: #9aa0a6;
    }
    
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
    }
    
    .buttons {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }
    
    .btn {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      padding: 10px 18px;
      cursor: pointer;
    }
    
    /* Vista de correos */
    #vista-correo {
      display: none;
      flex: 1;
      max-width: 800px;
      width: 90%;
      margin: 20px auto;
      border: 1px solid #dfe1e5;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      flex-direction: column;
    }
    
    .mail-header {
      background-color: #f6f8fc;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dfe1e5;
      font-weight: bold;
    }
    
    .btn-volver {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    
    .mail-item {
      padding: 14px 20px;
      border-bottom: 1px solid #f1f3f4;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }
    
    /* Modal / Ventana de Iniciar Sesión y Crear Cuenta */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 32px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    
    .modal-logo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    
    .modal-title {
      font-size: 22px;
      color: #1f1f1f;
      margin-bottom: 6px;
    }
    
    .modal-subtitle {
      font-size: 14px;
      color: #444746;
      margin-bottom: 24px;
    }
    
    .modal-card input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #747775;
      border-radius: 4px;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
    }
    
    .modal-card input:focus {
      border-color: #0b57d0;
      box-shadow: 0 0 0 1px #0b57d0;
    }
    
    .modal-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    
    .btn-create-acc {
      background: none;
      border: none;
      color: #0b57d0;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
    }
    
    .btn-primary {
      background-color: #0b57d0;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 500;
      cursor: pointer;
    }
    
    footer {
      background-color: #f2f2f2;
      color: #70757a;
      font-size: 14px;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  
  <header>
    <button class="nav-link" onclick="mostrarCorreo()">INBOX</button>
    <button class="avatar-btn" id="avatarBtn" onclick="toggleCard(event)">U</button>
    <button class="btn-login" id="loginBtn" onclick="abrirModal(false)">Sign in</button>
    
    <div class="account-card" id="accountCard" onclick="event.stopPropagation()">
      <div class="account-big-avatar" id="cardAvatar">U</div>
      <div class="account-name" id="cardName">User</div>
      <div class="account-email" id="cardEmail">user@adapt.com</div>
      <button class="action-btn" onclick="abrirModal(true)">➕ Add another account</button>
      <button class="action-btn" onclick="cerrarSesion()">🚪 Log out/Sign  out</button>
    </div>
  </header>
  
  <!-- Modal estilo Google para Iniciar Sesión / Crear Cuenta -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <div class="modal-logo">
        <span class="b-blue">A</span><span class="b-red">D</span><span class="b-yellow">A</span><span class="b-blue">P</span><span class="b-green">T</span><span class="b-red">O</span><span class="b-yellow">S</span>
      </div>
      <div class="modal-title" id="formTitle">Log in/Sign in</div>
      <div class="modal-subtitle" id="formSubtitle">Go to Adapt</div>
      
      <input type="text" id="inputNombre" placeholder="Your name" style="display: none;">
      <input type="email" id="inputEmail" placeholder="Email or Phone">
      
      <div class="modal-buttons">
        <button type="button" class="btn-create-acc" id="btnToggleForm" onclick="activarModoCrear()">Create Account</button>
        <button type="button" class="btn-primary" onclick="guardarCuenta()">Next</button>
      </div>
    </div>
  </div>
  
  <main id="vista-busqueda">
    <div class="logo">
      <span class="b-blue">A</span><span class="b-red">d</span><span class="b-yellow">a</span><span class="b-blue">p</span><span class="b-green">t</span><span class="b-red"></span><span class="b-yellow"></span>
    </div>
    <form class="search-box" onsubmit="realizarBusqueda(event)">
      <span class="search-icon">🔍</span>
      <input type="text" id="busquedaInput" class="search-input" placeholder="Search via web...">
    </form>
    <div class="buttons">
      <button class="btn" onclick="realizarBusqueda(event)">Search Google</button>
    </div>
  </main>
  
  <section id="vista-correo">
    <div class="mail-header">
      <span id="titulo-correo">Inbox</span>
      <button class="btn-volver" onclick="mostrarBusqueda()">← Back to search engine</button>
    </div>
    <div class="mail-item" onclick="alert('inbox synchronized successfully')">
      <span>✉️ Welcome to Adapt Mail</span>
      <span style="font-size: 12px; color: #888;">Now</span>
    </div>
  </section>
  
  <footer>
    <span>AdaptOS</span>
    <span>Privacy • Terms</span>
  </footer>
  
  <script>
    let usuarioActual = { nombre: "Usuario", email: "adapt@workspace.com", inicial: "A" };
    let modoCrear = false;
    
    function toggleCard(e) {
      e.stopPropagation();
      document.getElementById('accountCard').classList.toggle('active');
    }
    
    document.addEventListener('click', () => {
      document.getElementById('accountCard').classList.remove('active');
    });
    
    function cerrarSesion() {
      document.getElementById('accountCard').classList.remove('active');
      document.getElementById('avatarBtn').style.display = 'none';
      document.getElementById('loginBtn').style.display = 'block';
    }
    
    function abrirModal(paraCrear) {
      document.getElementById('accountCard').classList.remove('active');
      document.getElementById('loginModal').classList.add('active');
      if (paraCrear) {
        activarModoCrear();
      } else {
        activarModoLogin();
      }
    }
    
    function activarModoCrear() {
      modoCrear = true;
      document.getElementById('formTitle').textContent = "Create an Adapt Account";
      document.getElementById('formSubtitle').textContent = "Enter your details";
      document.getElementById('inputNombre').style.display = 'block';
      document.getElementById('inputEmail').placeholder = "Choose your username (@Adapt.com)";
      document.getElementById('btnToggleForm').textContent = "I already have an account";
      document.getElementById('btnToggleForm').onclick = activarModoLogin;
    }
    
    function activarModoLogin() {
      modoCrear = false;
      document.getElementById('formTitle').textContent = "Log in/Sign in";
      document.getElementById('formSubtitle').textContent = "Go to Adapt";
      document.getElementById('inputNombre').style.display = 'none';
      document.getElementById('inputEmail').placeholder ="Email or Phone";
      document.getElementById('btnToggleForm').textContent = "Create account";
      document.getElementById('btnToggleForm').onclick = activarModoCrear;
    }
    
    function guardarCuenta() {
      const emailVal = document.getElementById('inputEmail').value.trim();
      const nombreVal = document.getElementById('inputNombre').value.trim();
      
      if (!emailVal) {
        alert("Pls enter an email or username.");
        return;
      }
      
      if (modoCrear) {
        usuarioActual.nombre = nombreVal || emailVal.split('@')[0];
        usuarioActual.email = emailVal.includes('@') ? emailVal : emailVal + "@buscalo.com";
      } else {
        usuarioActual.email = emailVal;
        usuarioActual.nombre = emailVal.split('@')[0];
      }
      
      usuarioActual.inicial = usuarioActual.nombre.charAt(0).toUpperCase();
      
      // Actualizar interfaz
      document.getElementById('avatarBtn').textContent = usuarioActual.inicial;
      document.getElementById('cardAvatar').textContent = usuarioActual.inicial;
      document.getElementById('cardName').textContent = usuarioActual.nombre;
      document.getElementById('cardEmail').textContent = usuarioActual.email;
      document.getElementById('titulo-correo').textContent = "Bandeja de Entrada — " + usuarioActual.email;
      
      // Mostrar avatar y ocultar modal y botón de login
      document.getElementById('loginModal').classList.remove('active');
      document.getElementById('loginBtn').style.display = 'none';
      document.getElementById('avatarBtn').style.display = 'flex';
      
      // Limpiar inputs
      document.getElementById('inputEmail').value = "";
      document.getElementById('inputNombre').value = "";
    }
    
    function mostrarCorreo() {
      document.getElementById('vista-busqueda').style.display = 'none';
      document.getElementById('vista-correo').style.display = 'flex';
    }
    
    function mostrarBusqueda() {
      document.getElementById('vista-correo').style.display = 'none';
      document.getElementById('vista-busqueda').style.display = 'flex';
    }
    
    function realizarBusqueda(e) {
      e.preventDefault();
      const q = document.getElementById('busquedaInput').value.trim();
      if (q) window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
    }
  </script>
  
</body>

</html>
